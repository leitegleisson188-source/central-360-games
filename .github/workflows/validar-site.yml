name: Validar Central 360 Games

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Testes do catálogo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rodar testes de navegação e conteúdo
        run: node --test tests/*.test.cjs
      - name: Verificar Worker e preparar assets da loja
        run: |
          node --check commerce/worker.mjs
          node commerce/scripts/prepare-assets.mjs
          test -s commerce/public/index.html
          test -s commerce/public/assets/store.js
          test ! -e commerce/public/worker.mjs
          test ! -e commerce/public/schema.sql
